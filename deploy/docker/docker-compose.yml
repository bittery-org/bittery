services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN is required}
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

  server:
    image: ghcr.io/bittery-org/bittery-server:${BITTERY_RELEASE:?BITTERY_RELEASE must pin an exact release}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://bittery:${DB_PASSWORD}@postgres:5432/bittery}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ORIGIN=https://${DOMAIN}
      - BITTERY_MODE=${BITTERY_MODE:-self-hosted}
      - BITTERY_ALLOW_INSECURE_HTTP=${BITTERY_ALLOW_INSECURE_HTTP:-false}
      - TRUST_PROXY_MODE=${TRUST_PROXY_MODE:-none}
      - BITTERY_STORAGE_ENDPOINT=${BITTERY_STORAGE_ENDPOINT:-}
      - BITTERY_STORAGE_BUCKET=${BITTERY_STORAGE_BUCKET:-}
      - BITTERY_STORAGE_ACCESS_KEY_ID=${BITTERY_STORAGE_ACCESS_KEY_ID:-}
      - BITTERY_STORAGE_SECRET_ACCESS_KEY=${BITTERY_STORAGE_SECRET_ACCESS_KEY:-}
      - BITTERY_STORAGE_REGION=${BITTERY_STORAGE_REGION:-auto}
      - BITTERY_STORAGE_CDN_URL=${BITTERY_STORAGE_CDN_URL:-}
      - RATE_LIMIT_ADAPTER=${RATE_LIMIT_ADAPTER:-auto}
      - RATE_LIMIT_REDIS_URL=${RATE_LIMIT_REDIS_URL:-}
      - REDIS_URL=${REDIS_URL:-}
      - SHARE_LINK_DAILY_LIMIT=${SHARE_LINK_DAILY_LIMIT:-50}
      - RATE_LIMIT_LOGIN_IP=${RATE_LIMIT_LOGIN_IP:-}
      - RATE_LIMIT_LOGIN_EMAIL=${RATE_LIMIT_LOGIN_EMAIL:-}
      - RATE_LIMIT_SIGNUP_IP=${RATE_LIMIT_SIGNUP_IP:-}
      - RATE_LIMIT_SIGNUP_EMAIL=${RATE_LIMIT_SIGNUP_EMAIL:-}
      - RATE_LIMIT_SIGNUP_VERIFY_REQUEST=${RATE_LIMIT_SIGNUP_VERIFY_REQUEST:-}
      - RATE_LIMIT_SIGNUP_VERIFY_MAX=${RATE_LIMIT_SIGNUP_VERIFY_MAX:-}
      - RATE_LIMIT_SIGNUP_VERIFY_LOCK_MINUTES=${RATE_LIMIT_SIGNUP_VERIFY_LOCK_MINUTES:-}
      - RATE_LIMIT_RECOVERY_REQUEST=${RATE_LIMIT_RECOVERY_REQUEST:-}
      - RATE_LIMIT_RECOVERY_VERIFY_MAX=${RATE_LIMIT_RECOVERY_VERIFY_MAX:-}
      - RATE_LIMIT_RECOVERY_LOCK_MINUTES=${RATE_LIMIT_RECOVERY_LOCK_MINUTES:-}
      - RATE_LIMIT_AUTH_IP=${RATE_LIMIT_AUTH_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    image: ghcr.io/bittery-org/bittery-web:${BITTERY_RELEASE:?BITTERY_RELEASE must pin an exact release}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not `localhost`: the web image's busybox wget only tries the
      # first address getaddrinfo returns ([::1]) and nginx listens on IPv4 only.
      # See the HEALTHCHECK comment in apps/web/Dockerfile.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Built-in PostgreSQL — activate with: docker compose --profile builtin-db up -d
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles:
      - builtin-db
    environment:
      - POSTGRES_DB=bittery
      - POSTGRES_USER=bittery
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required when using built-in database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bittery -d bittery"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional MinIO for image/file uploads — activate with: docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles:
      - storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=bittery
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional Valkey for shared pubsub + rate limiting — activate with: docker compose --profile cache up -d
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    profiles:
      - cache
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
