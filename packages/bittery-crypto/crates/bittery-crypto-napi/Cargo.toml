[package]
name = "bittery-crypto-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NAPI bindings for Bittery crypto (Node.js/Bun server)"

[lib]
crate-type = ["cdylib"]

[dependencies]
bittery-crypto-core.workspace = true

# NAPI bindings
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

# Encoding
base64.workspace = true

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
