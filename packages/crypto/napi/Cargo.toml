[package]
name = "bittery-crypto-napi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NAPI bindings for Bittery crypto (Node.js/Bun server)"

[lib]
crate-type = ["cdylib"]

[dependencies]
bittery-crypto-core = { path = "../core/crates/bittery-crypto-core" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
base64 = "0.22"

[build-dependencies]
napi-build = "2.3"

[profile.release]
lto = true
opt-level = 3
