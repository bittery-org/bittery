[workspace]
resolver = "2"
members = [
    "crates/bittery-crypto-core",
    "crates/bittery-crypto-wasm",
    "crates/bittery-crypto-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/bittery-org/bittery"
authors = ["Bittery <team@bittery.com>"]

[workspace.dependencies]
# Crypto (RustCrypto - audited)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.11"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
rand = "0.8"

# BigInteger for SRP
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# Encoding
base64 = "0.22"
hex = "0.4"
ciborium = "0.2"

# Bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# NAPI bindings (for Bun/Node server)
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"

# Internal crates
bittery-crypto-core = { path = "crates/bittery-crypto-core" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
