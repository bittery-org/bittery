# Only the `web` (WASM) target is generated through uniffi-bindgen-react-native.
# Android's Kotlin and .so files come from build-android.sh, which calls uniffi
# and cargo-ndk directly - see packages/crypto/android/README.md.
name: "@bittery/crypto-wasm"
projectVersion: 1.0.0
repository: https://github.com/bittery-org/bittery
rust:
  directory: ../core
  manifestPath: crates/bittery-crypto-api/Cargo.toml
web:
  manifestPath: crate/Cargo.toml
  manifestPatchFile: ../core/wasm.Cargo.patch.toml
  wasmCrateName: bittery-crypto-wasm
  workspace: false
  target: web
  tsBindings: generated
  entrypoint: index.ts
