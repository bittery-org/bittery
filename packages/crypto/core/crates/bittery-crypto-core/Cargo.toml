[package]
name = "bittery-crypto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core cryptographic primitives for Bittery password manager"

[features]
attachment-move-test-vectors = []

[dependencies]
# Crypto (RustCrypto - audited)
aes-gcm.workspace = true
aes.workspace = true
ghash.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
rsa.workspace = true
p256.workspace = true
ecdsa.workspace = true
rand.workspace = true

# BigInteger for SRP
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true

# Encoding
base64.workspace = true
hex.workspace = true
ciborium.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
subtle.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true

# `std::time::SystemTime::now()` traps on wasm32-unknown-unknown, so `totp.rs`
# reads the clock through `Date.now()` there. See `now_unix_seconds`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }
