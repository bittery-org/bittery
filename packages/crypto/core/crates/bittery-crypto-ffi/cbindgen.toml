# cbindgen configuration for bittery-crypto-ffi

language = "C"

# Style options
header = "/* Auto-generated by cbindgen - DO NOT EDIT */"
include_guard = "BITTERY_CRYPTO_H"
tab_width = 4
documentation = true
documentation_style = "doxy"

# Type settings
[parse]
parse_deps = false
include = ["bittery-crypto-ffi"]

[export]
include = [
    "DerivedKeysResult",
    "EncryptResult",
    "RsaKeyPairResult",
    "EphemeralResult",
    "SessionResult",
]

[fn]
prefix = "BITTERY_API"
postfix = ""

[struct]
derive_eq = true
