# The UniFFI CLI has no published binary, so every project that generates
# bindings ships this three-line wrapper. It exists to pin the generator to the
# exact `uniffi` version `bittery-crypto-api` links against — a mismatch there
# produces Kotlin that compiles and then fails at the FFI boundary at runtime.
[package]
name = "bittery-uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Version-pinned UniFFI binding generator for the Bittery crypto API"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.31.2", features = ["cli"] }
