[workspace]
resolver = "2"
members = [
    "crates/bittery-client-bindings",
    "crates/bittery-client-core",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/bittery-org/bittery"
authors = ["Bittery <team@bittery.com>"]

[workspace.dependencies]
async-trait = "=0.1.89"
bittery-client-core = { path = "crates/bittery-client-core" }
bittery-crypto-core = { path = "../crypto/core/crates/bittery-crypto-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.47.1", features = ["macros", "rt", "sync"] }
uniffi = { version = "=0.31.2", features = ["tokio", "wasm-unstable-single-threaded"] }
wasm-bindgen = "=0.2.126"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
