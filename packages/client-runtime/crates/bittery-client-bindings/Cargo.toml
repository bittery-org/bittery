[package]
name = "bittery-client-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shallow native and Web bindings for the Bittery Client Runtime"

[features]
default = []
artifact-control-contract-schema = ["dep:schemars"]
transfer-control-contract-schema = ["dep:schemars"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
bittery-client-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
schemars = { version = "=1.2.2", optional = true }
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait.workspace = true
getrandom = { version = "=0.4.2", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "=0.2.16", features = ["js"] }
js-sys = "=0.3.103"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.76"
zeroize.workspace = true

[[bin]]
name = "generate-artifact-control-contract-schema"
path = "src/bin/generate_artifact_control_contract_schema.rs"
required-features = ["artifact-control-contract-schema"]

[[bin]]
name = "generate-transfer-control-contract-schema"
path = "src/bin/generate_transfer_control_contract_schema.rs"
required-features = ["transfer-control-contract-schema"]
