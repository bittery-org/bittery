[package]
name = "bittery-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Bittery client Runtime and Replica policy"

[features]
default = []
persistence-contract-schema = ["dep:schemars"]
platform-storage-contract-schema = ["dep:schemars"]
http-transport-contract-schema = ["dep:schemars"]
runtime-protocol-contract-schema = ["dep:schemars"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bittery-crypto-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
schemars = { version = "=1.2.2", optional = true }
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "=0.3.103"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.76"

[[bin]]
name = "generate-persistence-contract-schema"
path = "src/bin/generate_persistence_contract_schema.rs"
required-features = ["persistence-contract-schema"]

[[bin]]
name = "generate-platform-storage-contract-schema"
path = "src/bin/generate_platform_storage_contract_schema.rs"
required-features = ["platform-storage-contract-schema"]

[[bin]]
name = "generate-http-transport-contract-schema"
path = "src/bin/generate_http_transport_contract_schema.rs"
required-features = ["http-transport-contract-schema"]

[[bin]]
name = "generate-runtime-protocol-contract-schema"
path = "src/bin/generate_runtime_protocol_contract_schema.rs"
required-features = ["runtime-protocol-contract-schema"]
