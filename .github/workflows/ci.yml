name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "10.18.3"
  WASM_PACK_VERSION: "0.13.1"
  WASM_PACK_SHA256: "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      # Needs the base branch to detect edits to already-merged migrations.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            node scripts/check-migrations.mjs "origin/$GITHUB_BASE_REF"
          else
            node scripts/check-migrations.mjs
          fi

  # The crypto crate is the security core of the product and is only a path
  # dependency of the server, so `cargo test -p bittery-server` never runs its
  # tests. It needs its own job.
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto/core

      - name: Crypto fmt
        run: cargo fmt --all --check --manifest-path packages/crypto/core/Cargo.toml

      - name: Crypto lint
        run: cargo clippy --manifest-path packages/crypto/core/Cargo.toml -p bittery-crypto-core --all-targets -- -D warnings

      - name: Crypto tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path packages/crypto/core/Cargo.toml -p bittery-crypto-core
          elapsed="$(( $(date +%s) - start ))"
          echo "crypto tests: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Desktop fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Desktop lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # The IPC layer has a substantial #[cfg(windows)] surface (pipe security
  # descriptor, peer process identity) that no other job compiles — the release
  # workflow was previously the first thing to build it. A compile-only check is
  # enough here: the Windows-specific logic that can be unit tested (SDDL
  # construction, access masks, error mapping) is deliberately not cfg-gated, so
  # desktop-rust already exercises it on Linux.
  desktop-rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Desktop check (Windows)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  crypto-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto/core

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/$archive"
          echo "${WASM_PACK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          cp "$RUNNER_TEMP/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          chmod +x "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elapsed="$(( $(date +%s) - start ))"
          echo "wasm-pack install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build crypto WASM
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          packages/crypto/core/build-wasm.sh
          elapsed="$(( $(date +%s) - start ))"
          echo "crypto WASM build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: crypto-wasm
          path: packages/crypto/wasm
          if-no-files-found: error

  js-static:
    needs: crypto-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Biome
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm exec biome check .
          elapsed="$(( $(date +%s) - start ))"
          echo "Biome: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: i18n keys
        run: pnpm run i18n:check

      - name: Version sync
        run: pnpm run version:check

  js-types:
    needs: crypto-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run check-types
          elapsed="$(( $(date +%s) - start ))"
          echo "typecheck: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  js-tests:
    needs: crypto-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Driven by turbo rather than a hardcoded package list so a new package
      # with tests cannot silently go unrun. The Rust packages are excluded
      # because they have dedicated jobs (server, crypto).
      - name: Package tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm exec turbo run test \
            --filter='!server' \
            --filter='!@bittery/crypto-core' \
            --filter='!@bittery/crypto-napi'
          elapsed="$(( $(date +%s) - start ))"
          echo "package tests: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bittery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bittery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/bittery_test
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:3001
      BITTERY_MODE: self-hosted
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Migrate test database
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo run --manifest-path apps/server/Cargo.toml --bin migrate
          elapsed="$(( $(date +%s) - start ))"
          echo "server migration: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Server fmt
        run: cargo fmt --check --manifest-path apps/server/Cargo.toml

      - name: Compile server tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path apps/server/Cargo.toml --no-run
          elapsed="$(( $(date +%s) - start ))"
          echo "server test compile: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Server tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path apps/server/Cargo.toml
          elapsed="$(( $(date +%s) - start ))"
          echo "server test: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Server lint
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo clippy --manifest-path apps/server/Cargo.toml --all-targets --all-features -- -D warnings
          elapsed="$(( $(date +%s) - start ))"
          echo "server clippy: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: sccache stats
        if: always()
        run: sccache --show-stats
