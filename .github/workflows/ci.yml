name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  # Weekly dependency checks catch upstream breakage, while Web E2E detects
  # browser-harness rot without rerunning every CI job.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  # `github.event_name` is part of the group so the weekly sweep on main cannot
  # cancel a real push build of the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "10.18.3"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Needs the base branch to detect edits to already-merged migrations.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            node scripts/check-migrations.mjs "origin/$GITHUB_BASE_REF"
          else
            node scripts/check-migrations.mjs
          fi

  # The crypto crate is the security core of the product and is only a path
  # dependency of the server, so `cargo test -p bittery-server` never runs its
  # tests. It needs its own job.
  #
  # `--workspace` keeps the exported UniFFI API and its format vectors covered
  # with the core, rather than leaving either outside the host test suite.
  crypto:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto/core

      - name: Crypto fmt
        run: cargo fmt --all --check --manifest-path packages/crypto/core/Cargo.toml

      - name: Crypto lint
        run: cargo clippy --manifest-path packages/crypto/core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Crypto tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path packages/crypto/core/Cargo.toml --workspace
          elapsed="$(( $(date +%s) - start ))"
          echo "crypto tests: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  client-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/client-runtime
            packages/crypto/core

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Runtime format, lint, tests, and generated contracts
        run: pnpm --filter @bittery/client-runtime check

  crypto-bindings:
    name: crypto-bindings-${{ matrix.binding }}
    strategy:
      fail-fast: false
      # Weekly E2E only needs the WASM artifact; native bindings remain covered
      # by change-driven CI rather than making the harness-rot check wait for them.
      matrix: ${{ fromJSON(github.event_name == 'schedule' && '{"include":[{"binding":"wasm","runs-on":"ubuntu-latest","targets":"wasm32-unknown-unknown"}]}' || '{"include":[{"binding":"wasm","runs-on":"ubuntu-latest","targets":"wasm32-unknown-unknown"},{"binding":"android","runs-on":"ubuntu-latest","targets":"aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"}]}') }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto/core
          key: bindings-${{ matrix.binding }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Android Rust tooling
        if: matrix.binding == 'android'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Lint WASM binding
        if: matrix.binding == 'wasm'
        run: >-
          cargo clippy --manifest-path packages/crypto/core/Cargo.toml
          -p bittery-crypto-api --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Build crypto WASM
        if: matrix.binding == 'wasm'
        run: packages/crypto/core/build-wasm.sh

      - name: Build Android bindings
        if: matrix.binding == 'android'
        run: pnpm run build:crypto-android

      # The uniffi/wasm-bindgen output above is committed (only the native
      # binaries - .wasm and the jniLibs .so files - are gitignored), so a source
      # change that regenerates it differently than what's checked in must fail
      # here rather than surface as an unreviewed drift later.
      - name: Check generated bindings are committed
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.binding }}" in
            wasm)
              paths=(packages/crypto/wasm/generated)
              regen_cmd="pnpm run build:crypto-wasm"
              ;;
            android)
              # The Kotlin only. The .so files beside it are gitignored binaries, rebuilt
              # before every app compile.
              paths=(packages/crypto/android/generated/java)
              regen_cmd="pnpm run build:crypto-android"
              ;;
          esac
          if ! git diff --exit-code -- "${paths[@]}"; then
            echo "::error::Generated crypto bindings under ${paths[*]} are out of date. Re-run \`$regen_cmd\` locally and commit the updated files."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: matrix.binding == 'wasm'
        with:
          name: crypto-wasm
          path: packages/crypto/wasm
          if-no-files-found: error

  desktop-rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Desktop fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Desktop lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # `cargo test` above regenerates apps/desktop/src/generated (ts-rs writes
      # the bindings from a #[test]), so the diff has to come after it. ADR 0012
      # claims CI diffs these; until now only the local check:ci:rust script did,
      # and a Rust wire-format change could land with a stale TypeScript mirror
      # that breaks apps/extension at runtime instead of here.
      - name: Check generated desktop bindings are committed
        shell: bash
        run: |
          set -euo pipefail
          # Stage intent-to-add first: `git diff` ignores untracked paths, so a
          # brand-new #[ts(export_to = ...)] target would otherwise pass.
          git add --intent-to-add -- apps/desktop/src/generated
          if ! git diff --exit-code -- apps/desktop/src/generated; then
            echo "::error::apps/desktop/src/generated is out of date. Re-run \`cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml\` locally and commit the updated files."
            exit 1
          fi

  # The IPC layer has a substantial #[cfg(windows)] surface (pipe security
  # descriptor, peer process identity) that no other job compiles — the release
  # workflow was previously the first thing to build it. A compile-only check is
  # enough here: the Windows-specific logic that can be unit tested (SDDL
  # construction, access masks, error mapping) is deliberately not cfg-gated, so
  # desktop-rust already exercises it on Linux.
  desktop-rust-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Desktop check (Windows)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  js-static:
    if: github.event_name != 'schedule'
    needs: crypto-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # openapi.v1.json and src/generated/schema.ts must stay in lockstep - this
      # was never checked in CI, so the two could drift silently after a manual
      # edit to either file.
      - name: API contract generated schema
        run: pnpm --filter @bittery/api-contract run check:generated

      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Biome
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm exec biome check .
          elapsed="$(( $(date +%s) - start ))"
          echo "Biome: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: i18n keys
        run: pnpm run i18n:check

      # The package layering ADR 0012 rests on (ui ↛ core, sync ↛ storage,
      # packages ↛ apps) ran in the local check:ci script only, so on CI it was
      # maintained by discipline rather than enforced.
      - name: Architecture layering
        run: pnpm run architecture:check

      - name: Version sync
        run: pnpm run version:check

      # Closed issue #31 asked for this and only the one-off grep was done, which
      # is how three RATE_LIMIT_SIGNUP_VERIFY_* variables reached .env.example and
      # docker-compose.yml without ever reaching the self-hosting docs.
      - name: Env var docs
        run: pnpm run env:check

  # Diffs the REST contract against the PR's base branch with oasdiff so a
  # breaking change (removed path, narrowed response, newly required field)
  # fails the PR instead of shipping to an unversioned client. Neutral outside
  # pull requests: a push to main has no PR base to diff against, and a spec
  # that does not exist yet on the base branch (new package, or this file's own
  # introducing commit) is not a break either.
  openapi-diff:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract base OpenAPI spec
        id: base_spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .oasdiff
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request - nothing to diff against." >&2
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:packages/api-contract/openapi.v1.json" > .oasdiff/base.json 2>/dev/null; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "No openapi.v1.json on the base branch - nothing to diff against." >&2
            echo "has_base=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Breaking-change check
        if: steps.base_spec.outputs.has_base == 'true'
        uses: docker://tufin/oasdiff:latest
        with:
          args: >-
            breaking --fail-on ERR
            --err-ignore docs/openapi-breaking-changes.md
            .oasdiff/base.json packages/api-contract/openapi.v1.json

  js-types:
    if: github.event_name != 'schedule'
    needs: crypto-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run check-types
          elapsed="$(( $(date +%s) - start ))"
          echo "typecheck: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  js-tests:
    if: github.event_name != 'schedule'
    needs: crypto-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Driven by turbo rather than a hardcoded package list so a new package
      # with tests cannot silently go unrun. The Rust packages are excluded
      # because they have dedicated jobs (server, crypto) - this runner has no
      # Rust toolchain, and their `test` scripts all shell out to `cargo test`.
      - name: Package tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm exec turbo run test \
            --filter='!server' \
            --filter='!@bittery/crypto-core'
          elapsed="$(( $(date +%s) - start ))"
          echo "package tests: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # The repo scripts are outside every turbo package, so `turbo run test`
      # above never reaches them.
      - name: Script tests
        run: node --test "scripts/**/*.test.mjs"

  # Frontend-only, like js-types / js-static: the generated crypto WASM apps/mobile imports
  # (D6 in docs/mobile-migration-decisions.md) is gitignored and vite build cannot resolve it
  # without the artifact crypto-bindings already produced, so this reuses that artifact exactly
  # like js-types does rather than rebuilding it. The Android half is mobile-android, below.
  #
  # `check-types` also runs the app's own `lint:promises` scan (see package.json) - that is
  # this app's only noMisusedPromises enforcement (gap 10 in mobile-migration-state.md), so it
  # rides along with typecheck rather than needing its own step.
  mobile:
    if: github.event_name != 'schedule'
    needs: crypto-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # packages/i18n/src/paraglide is generated, and mobile imports it
      # (src/providers/i18n-provider.tsx).
      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck (+ lint:promises)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm exec turbo -F mobile check-types
          elapsed="$(( $(date +%s) - start ))"
          echo "mobile typecheck: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Web-app-shaped build (tsc + vite), no Tauri/Android toolchain involved -
      # proves the renderer bundles, independent of whether the native shell does.
      - name: Vite build
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm --filter mobile exec vite build
          elapsed="$(( $(date +%s) - start ))"
          echo "mobile vite build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Biome
        run: pnpm exec biome check apps/mobile

  # Detects changes under apps/mobile or the crypto packages it embeds, so
  # mobile-android (below) can skip the heavy Android/NDK toolchain on PRs that cannot
  # have broken it. See D11 in docs/mobile-migration-decisions.md for what this trades off.
  # Runs unconditionally (including on schedule) so the boolean is always available; the
  # schedule/release/dispatch cases are handled by mobile-android's own `if`.
  mobile-android-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'apps/mobile/**'
              - 'packages/crypto/**'
              - '.cargo/config.toml'
              - 'scripts/check-android-page-size.mjs'
              # DomainMatchVectorsTest (run in mobile-android) pins the plugin's Kotlin
              # matching to this file, so a change here must re-run that test.
              - 'apps/extension/src/lib/hostname.ts'

  # The full `pnpm tauri android build` needs the Android SDK, the NDK, a JDK, all four Rust
  # Android targets, and pnpm build:crypto-android for the UniFFI .so files the credential
  # provider loads (D4b) - on top of build:crypto-wasm for the renderer bundle (D6). That is
  # slow and heavy, so it does not run on every push (see D11 in
  # docs/mobile-migration-decisions.md for the alternatives considered and what this misses).
  #
  # GitHub's ubuntu-latest image ships the Android SDK and several NDK versions preinstalled
  # (crypto-bindings' android leg already relies on this, with no explicit SDK
  # setup step), so only the JDK and the Rust targets are added here.
  #
  # No signing secret is read anywhere in this job - the build is `--debug`, unsigned, exactly
  # what a developer runs locally. If a signing step is ever added here, it must check
  # `secrets.<NAME> != ''` first so a missing secret degrades that one step, not the job.
  mobile-android:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) ||
      needs.mobile-android-changed.outputs.changed == 'true'
    needs: mobile-android-changed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/crypto/core
            apps/mobile/src-tauri
          key: mobile-android

      # Pinned exactly like crypto-bindings' android leg - a security gate must not itself be
      # an unpinned download, and the two jobs should build the same artifact the same way.
      - name: Install pinned Android Rust tooling
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run i18n:generate

      - uses: gradle/actions/setup-gradle@v5

      - name: Install pinned 16 KB-compatible NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "ndk;28.2.13676358" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build crypto WASM
        run: pnpm run build:crypto-wasm

      - name: Build crypto Android bindings (UniFFI .so)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run build:crypto-android
          elapsed="$(( $(date +%s) - start ))"
          echo "crypto android bindings: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Same command a developer runs locally (docs/mobile-migration-state.md), one arch only -
      # this is a breakage check, not a release artifact.
      - name: Tauri Android build (debug, aarch64)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run android:build
          elapsed="$(( $(date +%s) - start ))"
          echo "tauri android build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify 16 KB native-library alignment
        working-directory: apps/mobile
        run: pnpm run android:check-page-size

      - uses: actions/upload-artifact@v7
        with:
          name: mobile-debug-apk
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 7
          if-no-files-found: error

      # The credential provider is the only place DomainMatch runs, and its vectors are the
      # seam pinning it to apps/extension/src/lib/hostname.ts. The Gradle project only exists
      # after the build above generates gen/android/tauri.settings.gradle, so this cannot be
      # its own job.
      #
      # Filtered on purpose: CryptoTestVectors calls android.util.Base64 (a throwing stub
      # in the unit-test android.jar) and JNIs into the Rust library that is not loaded
      # here. The service package is pure (IME-chip copy and escrow policy).
      - name: Credential-provider unit tests
        working-directory: apps/mobile/src-tauri/gen/android
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          ./gradlew --no-daemon :tauri-plugin-bittery-credential-provider:testDebugUnitTest \
            --tests 'com.bittery.mobile.credentialprovider.domain.*' \
            --tests 'com.bittery.mobile.credentialprovider.service.*'
          elapsed="$(( $(date +%s) - start ))"
          echo "credential-provider unit tests: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: credential-provider-test-report
          path: apps/mobile/src-tauri/plugins/credential-provider/android/build/reports/tests/**
          retention-days: 7
          if-no-files-found: warn

  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bittery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bittery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/bittery_test
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:3001
      BITTERY_MODE: self-hosted
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Server fmt
        run: cargo fmt --check --manifest-path apps/server/Cargo.toml

      # Compile-time SQLx metadata is checked against the current schema. The server tests still
      # create and migrate isolated databases; this is the one reason the service database itself
      # must be migrated in CI.
      - name: Install SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.8.6 --locked --no-default-features
          --features rustls,postgres

      - name: SQLx metadata matches migrations
        working-directory: apps/server
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --lib

      # The other half of `contracts:check`. js-static proves openapi.v1.json and
      # the generated TypeScript agree; only this proves the committed spec still
      # matches the live Axum routes. openapi-diff is not a substitute - it
      # compares the committed spec against the base branch, so a route change
      # with a stale spec passed CI green.
      - name: OpenAPI spec matches routes
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo run --quiet --manifest-path apps/server/Cargo.toml --bin write-openapi -- --check
          elapsed="$(( $(date +%s) - start ))"
          echo "openapi spec check: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile server tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path apps/server/Cargo.toml --no-run
          elapsed="$(( $(date +%s) - start ))"
          echo "server test compile: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Server tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo test --manifest-path apps/server/Cargo.toml
          elapsed="$(( $(date +%s) - start ))"
          echo "server test: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Server lint
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo clippy --manifest-path apps/server/Cargo.toml --all-targets --all-features -- -D warnings
          elapsed="$(( $(date +%s) - start ))"
          echo "server clippy: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The Playwright suite is the only check that drives the real client crypto
  # against a real server through a browser, and no workflow ever referenced it,
  # which is exactly why it rotted. It builds `bittery-server` and `migrate`
  # from source (apps/web/tests/e2e-launch.mjs), so it carries the server job's
  # Rust toolchain and cache alongside the JS toolchain.
  #
  # Takes the crypto WASM artifact from crypto-bindings like js-static / js-types / js-tests:
  # the web app does not resolve without it, and rebuilding it here would mean a
  # another copy of the pinned ubrn build for no gain.
  web-e2e-run:
    name: web-e2e-run (${{ matrix.name }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v'))
    needs: crypto-bindings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloud 1/2
            project: cloud
            shard: --shard=1/2
            artifact: cloud-1-of-2
          - name: cloud 2/2
            project: cloud
            shard: --shard=2/2
            artifact: cloud-2-of-2
          - name: self-hosted
            project: self-hosted
            shard: ""
            artifact: self-hosted
    runs-on: ubuntu-latest
    # A cache-cold debug build of the server is many minutes before a single
    # spec runs, and CI runs 2 workers with 2 retries, so a bad-luck run can be
    # several times the median. A false timeout costs more than a slow job.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          # 5436, not the 5432 the server job uses:
          # apps/web/tests/fixtures/e2e-database.ts holds the only copy of this
          # URL and points at the port apps/server/docker-compose.yml publishes
          # locally. Publishing the same port here keeps that single copy true in
          # both places.
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
          key: e2e-${{ matrix.artifact }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm install --frozen-lockfile
          elapsed="$(( $(date +%s) - start ))"
          echo "pnpm install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # playwright.config.ts generates this on load if it is missing, but doing
      # it here keeps the cost out of the webServer startup window.
      - name: Generate i18n
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm run i18n:generate
          elapsed="$(( $(date +%s) - start ))"
          echo "i18n generate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # e2e-launch.mjs builds these on demand, but it does so inside Playwright's
      # webServer timeout and with both API servers contending for the same cargo
      # target lock. Building once, up front, keeps a cold build in its own step.
      - name: Build server binaries
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo build --manifest-path apps/server/Cargo.toml --bin bittery-server --bin migrate
          elapsed="$(( $(date +%s) - start ))"
          echo "e2e server build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # tests/fixtures/e2e-database.ts drives psql over the same DATABASE_URL the
      # servers use (locally it falls back to `docker exec bittery-postgres`,
      # which no runner has). The runner image ships psql today, but not by
      # contract, so install it when it is absent.
      - name: Ensure psql
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # `playwright` is a dependency of `web` only, so it is not on the root bin
      # path.
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm --filter web exec playwright install --with-deps chromium
          elapsed="$(( $(date +%s) - start ))"
          echo "playwright install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Chromium runs with --disable-dev-shm-usage, so its shared-memory segments
      # land in TMPDIR; a RAM-backed one filled at 2 workers locally and killed
      # renderers. playwright.config.ts points TMPDIR at the workspace disk, so
      # this only has to confirm the runner matches what `workers` assumes.
      - name: Runner capacity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Runner capacity"
            echo '```'
            echo "nproc: $(nproc)"
            df -hT /tmp /dev/shm "$GITHUB_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Web E2E tests
        shell: bash
        env:
          E2E_SERVER_BINARIES_READY: "1"
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm --filter web exec playwright test \
            --project=${{ matrix.project }} \
            ${{ matrix.shard }} \
            --reporter=blob
          elapsed="$(( $(date +%s) - start ))"
          echo "web E2E (${{ matrix.name }}): ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-blob-${{ matrix.artifact }}
          path: apps/web/blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Report aggregation stays separate so the required `web-e2e` check remains
  # stable as the shard implementation changes.
  # 531 LOC of Playwright covering the "not saved while locked" invariant was
  # wired to no workflow at all, which is worse than having no suite: it looked
  # covered and never ran. Gated exactly like web-e2e-run - schedule, manual
  # dispatch, and release/v* PRs - because it builds the server from source and
  # boots two dev servers, which is not ordinary-PR cost.
  #
  # Single job, no sharding: playwright.config.ts pins `workers: 1` because
  # Chromium loads one unpacked extension per browser context and the specs
  # share a save-prompt surface.
  extension-e2e-run:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v'))
    needs: crypto-bindings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          # 5436, matching web-e2e-run and apps/server/docker-compose.yml.
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTC_WRAPPER: sccache
      DATABASE_URL: postgresql://postgres:password@localhost:5436/postgres
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:3001
      BITTERY_MODE: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: crypto-wasm
          path: packages/crypto/wasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
          key: extension-e2e

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run i18n:generate

      # playwright.config.ts starts `apps/server`'s dev script inside its
      # webServer timeout; a cold cargo build does not fit in it.
      - name: Build server binaries
        run: cargo build --manifest-path apps/server/Cargo.toml --bin bittery-server --bin migrate

      - name: Migrate database
        run: cargo run --manifest-path apps/server/Cargo.toml --bin migrate

      # Chromium loads the unpacked extension from apps/extension/dist, so the
      # build has to exist before Playwright launches.
      - name: Build extension
        run: pnpm --filter extension run build:release

      - name: Install Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Extension E2E tests
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          pnpm --filter extension run test:e2e
          elapsed="$(( $(date +%s) - start ))"
          echo "extension e2e: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: extension-e2e-report
          path: apps/extension/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  web-e2e-report:
    if: always() && needs.web-e2e-run.result != 'skipped' && needs.web-e2e-run.result != 'cancelled'
    needs: web-e2e-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: blob-report
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm --filter web test:e2e:merge-reports -- "$GITHUB_WORKSPACE/blob-report"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: error

  # Stable branch-protection context: matrix leg names may change as the suite
  # grows, while this check remains exactly `web-e2e`.
  web-e2e:
    if: always()
    needs:
      - web-e2e-run
      - web-e2e-report
    runs-on: ubuntu-latest
    steps:
      - name: Check Web E2E suite
        shell: bash
        env:
          E2E_REQUIRED: >-
            ${{ github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) }}
        run: |
          set -euo pipefail
          if [ "$E2E_REQUIRED" != "true" ]; then
            echo "Web E2E is required only for releases, scheduled runs, and manual verification."
            exit 0
          fi
          run_result="${{ needs.web-e2e-run.result }}"
          report_result="${{ needs.web-e2e-report.result }}"
          if [ "$run_result" != "success" ] || [ "$report_result" != "success" ]; then
            echo "web-e2e-run: $run_result"
            echo "web-e2e-report: $report_result"
            exit 1
          fi

  # Mirrors the web-e2e gate: a job skipped by its own `if` reports "skipped",
  # which branch protection reads as passing, so the stable required check has to
  # be this aggregate rather than extension-e2e-run itself.
  extension-e2e:
    if: always()
    needs:
      - extension-e2e-run
    runs-on: ubuntu-latest
    steps:
      - name: Check extension E2E suite
        shell: bash
        env:
          E2E_REQUIRED: >-
            ${{ github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) }}
        run: |
          set -euo pipefail
          if [ "$E2E_REQUIRED" != "true" ]; then
            echo "Extension E2E is required only for releases, scheduled runs, and manual verification."
            exit 0
          fi
          run_result="${{ needs.extension-e2e-run.result }}"
          if [ "$run_result" != "success" ]; then
            echo "extension-e2e-run: $run_result"
            exit 1
          fi

  # Nothing in CI built a container image; the release workflow was the first
  # thing to try, which is how an unreachable HEALTHCHECK probe and a corepack
  # removal in a floating Node base tag both reached a tag before anyone noticed.
  # Build only - the release workflow is the only place that pushes.
  #
  # Deliberately has no `if: github.event_name != 'schedule'` guard, for the same
  # reason as cargo-deny: the inputs that can break these builds live outside the
  # repo. `rust:1-bookworm`, `node:24-bookworm-slim`, `debian:bookworm-slim`,
  # `nginxinc/nginx-unprivileged:1.31-alpine` and `caddy:alpine` are all floating
  # tags, and a base image that changes under an untouched Dockerfile is exactly
  # the failure the corepack break was. No commit triggers it, so only the cron
  # catches it.
  #
  # Same GHA cache scopes as release.yml, so the two workflows warm each other's
  # layers rather than each paying for a cold Rust build.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      # One broken image must not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            file: apps/server/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          # The Railway edge proxy: a Caddy build with the Cloudflare DNS plugin.
          # Its build context is its own directory, not the repo root.
          - name: caddy
            context: deploy/railway
            file: deploy/railway/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record start
        run: echo "DOCKER_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Report timing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          elapsed="$(( $(date +%s) - DOCKER_BUILD_START ))"
          echo "docker ${{ matrix.name }} image: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  # `docker` is the required status check, but a matrix job reports one context
  # per leg (`docker (server, ., apps/server/Dockerfile)`), so the bare name was
  # never reported and the requirement sat pending on every PR. This job owns
  # that name and survives matrix edits, which the per-leg contexts do not.
  docker:
    if: always()
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Check image builds
        run: |
          set -euo pipefail
          result="${{ needs.docker-build.result }}"
          if [ "$result" != "success" ]; then
            echo "docker-build: $result"
            exit 1
          fi

  # The self-hosting Compose stack ships no Dockerfile of its own - it pins
  # published images - so there is nothing to build, but an interpolation typo or
  # an unknown key in it breaks every self-hoster who copies the file. `config`
  # parses and resolves it; the placeholder values satisfy the `${VAR:?}` guards
  # so the parse is what fails, not a missing variable.
  docker-compose-config:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate self-hosted Compose stack
        shell: bash
        env:
          DOMAIN: example.com
          BITTERY_RELEASE: 0.0.0-ci-validation-only
          JWT_SECRET: ci-validation-only
          DB_PASSWORD: ci-validation-only
          MINIO_ROOT_PASSWORD: ci-validation-only
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

  # Vulnerability-database gate. This repo has three independent Cargo lockfiles
  # and takes weekly automated Cargo bumps from Dependabot; without this job a
  # bump could land a crate carrying a published RustSec advisory and nothing
  # would say so. All three lockfiles are checked against the single root
  # deny.toml — a gate that only covered the server would be most of the problem
  # left in place.
  #
  # Deliberately has no `if: github.event_name != 'schedule'` guard: a new
  # advisory can be published against code that has not changed.
  #
  # Exceptions (currently the `rsa` Marvin advisory and the two `quick-xml`
  # advisories pinned by Tauri) live in deny.toml with a dated, written reason.
  # Never silence a finding here.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny shells out to `cargo metadata`, so a toolchain is still
      # needed even though nothing is compiled.
      - uses: dtolnay/rust-toolchain@stable

      # A security gate must not itself be an unpinned download.
      - name: Install cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$archive"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          cp "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          chmod +x "$HOME/.cargo/bin/cargo-deny"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elapsed="$(( $(date +%s) - start ))"
          echo "cargo-deny install: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      # Every lockfile is checked even if an earlier one fails, so one bad bump
      # does not hide another.
      - name: Advisories (all three lockfiles)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          failed=0
          for manifest in \
            apps/server/Cargo.toml \
            apps/desktop/src-tauri/Cargo.toml \
            packages/crypto/core/Cargo.toml
          do
            echo "::group::cargo deny check advisories -- $manifest"
            # --allow advisory-not-detected: one shared deny.toml spans three
            # disjoint dependency graphs, so every ignore entry belonging to a
            # different lockfile would otherwise warn on each run.
            if cargo deny --manifest-path "$manifest" --config deny.toml \
              check --allow advisory-not-detected advisories; then
              echo "- \`$manifest\`: advisories ok" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "- \`$manifest\`: **advisories FAILED**" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          elapsed="$(( $(date +%s) - start ))"
          echo "cargo-deny advisories: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
