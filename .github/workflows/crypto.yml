name: Build Crypto Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/bittery-crypto/**'
      - '.github/workflows/crypto.yml'
  pull_request:
    paths:
      - 'packages/bittery-crypto/**'
      - '.github/workflows/crypto.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run Rust tests first
  test:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/bittery-crypto/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        working-directory: packages/bittery-crypto
        run: cargo test --all

  # Build WASM package
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/bittery-crypto/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || true

      - name: Build WASM
        working-directory: packages/bittery-crypto
        run: ./build-wasm.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-wasm
          path: packages/bittery-crypto/pkg/
          retention-days: 7

  # Build NAPI for multiple platforms
  build-napi:
    name: Build NAPI (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (GNU libc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bittery-crypto.linux-x64-gnu.node

          # Linux ARM64 (GNU libc) - cross compile
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: bittery-crypto.linux-arm64-gnu.node
            cross: true

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bittery-crypto.darwin-arm64.node

          # macOS x64 (Intel)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: bittery-crypto.darwin-x64.node

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/bittery-crypto/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-napi-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      # Cross-compilation setup for Linux ARM64
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build NAPI
        working-directory: packages/bittery-crypto/crates/bittery-crypto-napi
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          pnpm exec napi build --platform --release --target ${{ matrix.target }}

      - name: List built files
        working-directory: packages/bittery-crypto/crates/bittery-crypto-napi
        run: ls -la *.node || echo "No .node files found"

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-napi-${{ matrix.target }}
          path: packages/bittery-crypto/crates/bittery-crypto-napi/*.node
          retention-days: 7
          if-no-files-found: error

  # Combine all NAPI artifacts
  package-napi:
    name: Package NAPI
    needs: build-napi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crypto-napi-*
          path: packages/bittery-crypto/crates/bittery-crypto-napi/
          merge-multiple: true

      - name: List all .node files
        run: |
          echo "Built native addons:"
          ls -la packages/bittery-crypto/crates/bittery-crypto-napi/*.node

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: crypto-napi-all-platforms
          path: |
            packages/bittery-crypto/crates/bittery-crypto-napi/*.node
            packages/bittery-crypto/crates/bittery-crypto-napi/index.js
            packages/bittery-crypto/crates/bittery-crypto-napi/index.d.ts
            packages/bittery-crypto/crates/bittery-crypto-napi/package.json
          retention-days: 30
