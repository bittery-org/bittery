name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push Docker images to GHCR"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PNPM_VERSION: "10.18.3"

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bittery-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # Lets self-hosters verify an image really came from this workflow:
      #   gh attestation verify oci://ghcr.io/<owner>/bittery-server:<tag> \
      #     --repo bittery-org/bittery
      - name: Attest server image provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bittery-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bittery-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Attest web image provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bittery-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.mjs "${GITHUB_REF#refs/tags/v}"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate i18n
        run: pnpm run i18n:generate

      - name: Configure desktop production env
        shell: bash
        run: |
          cat > apps/desktop/.env.production <<EOF
          BITTERY_EXTENSION_ID=${{ vars.BITTERY_EXTENSION_ID || 'YOUR_PRODUCTION_EXTENSION_ID_HERE' }}
          EOF

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BITTERY_EXTENSION_ID: ${{ vars.BITTERY_EXTENSION_ID || 'YOUR_PRODUCTION_EXTENSION_ID_HERE' }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      - name: Archive desktop artifacts
        shell: bash
        run: |
          mkdir -p release-upload
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              find apps/desktop/src-tauri/target -path "*/release/bundle/*" -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) ! -name "default._*" -exec cp {} release-upload/ \;
              ;;
            x86_64-pc-windows-msvc)
              find apps/desktop/src-tauri/target -path "*/release/bundle/*" -type f \( -name "*.msi" -o -name "*setup.exe" -o -name "Bittery.exe" \) -exec cp {} release-upload/ \;
              ;;
            x86_64-unknown-linux-gnu)
              find apps/desktop/src-tauri/target -path "*/release/bundle/*" -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release-upload/ \;
              ;;
          esac
          if [ -z "$(ls -A release-upload)" ]; then
            echo "No desktop artifacts found for ${{ matrix.target }}"
            exit 1
          fi
          tar -czf "desktop-${{ matrix.target }}.tar.gz" -C release-upload .

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: desktop-${{ matrix.target }}.tar.gz

  build-extension:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.mjs "${GITHUB_REF#refs/tags/v}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto/core

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.13.1 --locked

      - name: Build crypto WASM
        run: pnpm run build:crypto-wasm

      - name: Generate i18n
        run: pnpm run i18n:generate

      - name: Build extension
        run: pnpm run build:extension

      - name: Package extension
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          (cd apps/extension/dist && zip -r "../../../bittery-extension-${VERSION}.zip" .)

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: bittery-extension-*.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-server
      - build-web
      - build-desktop
      - build-extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: extension
          path: release-artifacts

      - name: Download macOS desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-aarch64-apple-darwin
          path: release-artifacts

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: release-artifacts

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: release-artifacts

      - name: Extract desktop archives
        shell: bash
        run: |
          for archive in release-artifacts/desktop-*.tar.gz; do
            [ -f "$archive" ] || continue
            tar -xzf "$archive" -C release-artifacts/
            rm "$archive"
          done

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web static assets from image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/bittery-web:${TAG}"
          CONTAINER_ID=$(docker create "${IMAGE}")
          docker cp "${CONTAINER_ID}:/usr/share/nginx/html" ./bittery-web-static
          docker rm "${CONTAINER_ID}"
          tar -czf "bittery-web-static-${TAG}.tar.gz" -C ./bittery-web-static .
          mv bittery-web-static-*.tar.gz release-artifacts/

      - name: Prepare stable release assets
        shell: bash
        run: |
          mkdir -p release-upload
          shopt -s nullglob

          mac_dmg=(release-artifacts/bittery_*_aarch64.dmg)
          if ((${#mac_dmg[@]})); then
            cp "${mac_dmg[0]}" release-upload/Bittery.dmg
          fi

          win_setup=(release-artifacts/bittery_*_x64-setup.exe)
          if ((${#win_setup[@]})); then
            cp "${win_setup[0]}" release-upload/Bittery-setup.exe
          fi

          if [ -f release-artifacts/Bittery.exe ]; then
            cp release-artifacts/Bittery.exe release-upload/Bittery.exe
          fi

          linux_appimage=(release-artifacts/bittery_*_amd64.AppImage)
          if ((${#linux_appimage[@]})); then
            cp "${linux_appimage[0]}" release-upload/Bittery.AppImage
          fi

          linux_deb=(release-artifacts/bittery_*_amd64.deb)
          if ((${#linux_deb[@]})); then
            cp "${linux_deb[0]}" release-upload/Bittery.deb
          fi

          extension_zip=(release-artifacts/bittery-extension-*.zip)
          if ((${#extension_zip[@]})); then
            cp "${extension_zip[0]}" release-upload/bittery-extension.zip
          fi

          web_static=(release-artifacts/bittery-web-static-*.tar.gz)
          if ((${#web_static[@]})); then
            cp "${web_static[0]}" release-upload/
          fi

          if [ -z "$(ls -A release-upload)" ]; then
            echo "No release assets prepared"
            exit 1
          fi

          ls -la release-upload/

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          # Written outside the directory first so the file being created is not
          # itself picked up by the glob.
          (cd release-upload && find . -maxdepth 1 -type f -printf '%P\0' \
            | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" release-upload/SHA256SUMS
          cat release-upload/SHA256SUMS

      # Binary provenance for the installers users actually download. Verify with:
      #   gh attestation verify Bittery.dmg --repo bittery-org/bittery
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-upload/*

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          cat > release-notes.md <<EOF
          ## Verifying this release

          Every asset below is checksummed in \`SHA256SUMS\` and carries a signed
          GitHub build provenance attestation proving it was produced by this
          repository's release workflow:

          \`\`\`bash
          sha256sum -c SHA256SUMS
          gh attestation verify Bittery.dmg --repo ${GITHUB_REPOSITORY}
          gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/bittery-server:${VERSION} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## Docker images

          Self-hosted deployments can pull versioned images from GHCR:

          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/bittery-server:${VERSION}
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/bittery-web:${VERSION}
          \`\`\`

          See [deploy/docker](https://github.com/${GITHUB_REPOSITORY}/tree/main/deploy/docker) for the Docker Compose stack.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-upload/**
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
