name: Tag release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate release pull request
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_branch="release/v${version}"
          marker="<!-- bittery-release:v${version} -->"
          if [ "$RELEASE_BRANCH" != "$expected_branch" ] || [[ "$PR_BODY" != *"$marker"* ]]; then
            echo "Release PR metadata does not match v${version}"
            exit 1
          fi
          node scripts/sync-version.mjs --check --check-history
          latest="$(node --input-type=module -e 'import { latestVersionFromTags, readReleaseTags } from "./scripts/release-version.mjs"; console.log(`v${latestVersionFromTags(readReleaseTags())}`)')"
          if [ "$latest" = "v${version}" ] || git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists"
            exit 1
          fi
          node --input-type=module -e 'import { compareVersions } from "./scripts/release-version.mjs"; if (compareVersions(process.argv[1], process.argv[2]) <= 0) process.exit(1)' "$version" "${latest#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Bittery v${VERSION}"
          git push origin "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}" -f push_images=true
