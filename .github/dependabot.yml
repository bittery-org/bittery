version: 2

updates:
  # Actions are the supply-chain path into a workflow that can publish releases
  # and push images to GHCR, so they get their own weekly window.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # One PR for the noisy low-risk stuff instead of dozens.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Pinned via pnpm.overrides in the root package.json; a Dependabot bump
      # here would not take effect and only creates noise.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  # One block for every Rust root in the repo — deliberately not one block per
  # root.
  #
  # There are four independent cargo resolution roots, each with its own
  # Cargo.lock: /apps/server, /apps/desktop/src-tauri, /packages/crypto/napi and
  # the workspace at /packages/crypto/core. The first three are *not* members of
  # that workspace; they reach bittery-crypto-core through a path dependency,
  # and bittery-crypto-core takes every crypto version from
  # `[workspace.dependencies]` in packages/crypto/core/Cargo.toml.
  #
  # So a block per root had all of them proposing the same edit to that one
  # shared manifest. hmac 0.12 -> 0.13 was raised three times (#96, #95, #89)
  # and aes-gcm 0.10 -> 0.11 twice (#98, #87), each PR differing only in which
  # lockfile it also touched. And because ci.yml builds every root on every PR,
  # a bump labelled "desktop" that quietly rewrote the crypto manifest failed
  # the `crypto` and `server` jobs too, so failures never pointed at the PR that
  # caused them.
  #
  # `directories` puts all four roots behind one block: the shared manifest is
  # edited once and every affected lockfile moves with it, in one PR.
  - package-ecosystem: cargo
    directories:
      - "/apps/server"
      - "/apps/desktop/src-tauri"
      - "/packages/crypto/core"
      # Previously uncovered. It is a fourth cargo root with its own lockfile
      # and the same path dependency on bittery-crypto-core, so leaving it out
      # let it drift behind the other three.
      - "/packages/crypto/napi"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Dependabot has no per-group labels, so the crypto review signal has to be
    # carried by the whole block rather than by the crypto group alone. That is
    # the safe direction here: all four roots link bittery-crypto-core, so any
    # cargo PR can move crypto code. Over-labelling a tauri bump costs a glance;
    # letting an aes-gcm bump through unflagged does not.
    # The old per-root `server` / `desktop` labels are gone because a PR now
    # spans directories and can no longer belong to a single app.
    labels:
      - dependencies
      - rust
      - crypto
      - needs-security-review
    # Was `chore(deps)` per app and `chore(crypto-deps)` for the crypto root;
    # a single block can only carry one prefix, so it names the ecosystem the
    # way `chore(actions)` and `chore(docker)` do.
    commit-message:
      prefix: "chore(cargo)"
    # Group order is significant: a dependency lands in the first group it
    # matches, so the crypto family is claimed before the catch-alls.
    groups:
      # The RustCrypto crates are interlocked through the shared `digest`,
      # `crypto-common`, `aead` and `elliptic-curve` traits: hmac 0.13 wants
      # digest 0.11 while sha2 0.10 still wants digest 0.10, and the two cannot
      # coexist behind one `impl Digest`. Bumped one crate at a time they arrive
      # as a wave of individually unbuildable PRs — the open 0.13/0.11 wave is
      # nine of them (#83, #86, #87, #89, #92, #95, #96, #97, #98, #99).
      # Majors are in the group on purpose: moving together is the entire point,
      # and this is still a dedicated group, not a catch-all, so the security
      # labels above still describe every PR it produces.
      rustcrypto:
        patterns:
          - aead
          - aes-gcm
          - block-buffer
          - cipher
          - const-oid
          - crypto-bigint
          - crypto-common
          - digest
          - ecdsa
          - elliptic-curve
          - getrandom
          - ghash
          - hkdf
          - hmac
          - inout
          - p256
          - password-hash
          - pbkdf2
          - polyval
          - rand
          - rand_chacha
          - rand_core
          - rsa
          - sha1
          - sha2
          - signature
          - subtle
          - universal-hash
          - zeroize
        update-types:
          - major
          - minor
          - patch
      # The tauri crates are version-locked to each other the same way the
      # RustCrypto ones are, and #91 is the proof: tauri-plugin-store and
      # tauri-plugin-opener raised their floor to tauri ^2.10, which dragged
      # tauri 2.9.5 -> 2.10.3, after which cargo resolved tauri-runtime to
      # 2.11.3 but left tauri-runtime-wry at 2.10.1 — a pairing upstream never
      # supports. That skew failed desktop-rust and desktop-rust-windows with
      # E0046 (missing `eval_script_with_callback`) and E0277 (`Sync` dropped
      # from `NewWindowHandler`), on every platform.
      #
      # So tauri-runtime shipped a source-breaking change in a MINOR release,
      # which is exactly what a bare minor/patch catch-all assumes cannot
      # happen. This group takes the family out of `cargo-minor-patch` (it is
      # ordered first, so it wins) and moves it atomically across all semver
      # levels.
      #
      # LIMITATION — this narrows the hazard, it does not close it. Dependabot
      # patterns match DIRECT dependencies only, and the crates that actually
      # skewed are transitive: tauri-runtime, tauri-runtime-wry and wry appear
      # in Cargo.lock, never in apps/desktop/src-tauri/Cargo.toml (`wry` does
      # not even match these patterns). The group constrains the manifest side —
      # tauri, tauri-build, tauri-plugin-* — so those move as one unit and stop
      # dragging the runtime forward piecemeal, but cargo remains free to split
      # the runtime pair underneath a single manifest bump. The durable guard is
      # a lockfile invariant test asserting tauri-runtime and tauri-runtime-wry
      # stay in step; that is being added separately.
      tauri:
        patterns:
          - tauri
          - tauri-*
        update-types:
          - major
          - minor
          - patch
      # One PR for the noisy low-risk stuff instead of dozens. Replaces the old
      # `server-minor-patch` / `desktop-minor-patch` groups, which raised one
      # such PR per root (#90, #91) even for dependencies they share.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Non-crypto majors stay individually reviewable rather than batched, but
      # `group-by: dependency-name` collapses the per-directory copies into one
      # PR each. Without it a major on a shared workspace dependency such as
      # num-bigint (#93) would still be raised once per root.
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major
        group-by: dependency-name

  - package-ecosystem: docker
    directories:
      - "/apps/server"
      - "/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
