[package]
name = "Bittery"
version = "0.5.2"
description = "Bittery Zero-Knowledge Password Manager"
authors = ["you"]
edition = "2021"
default-run = "Bittery"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bittery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Native messaging host binary
[[bin]]
name = "bittery-native-host"
path = "src/native_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-biometry = "0.2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6.0"
base64 = "0.23"

# Native crypto
bittery-crypto-core = { path = "../../../packages/crypto/core/crates/bittery-crypto-core" }

# OS keychain access (macOS Keychain, Windows Credential Manager, Linux Secret Service)
# Platform-specific features must be enabled for actual keychain storage
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["linux-native"]

# Peer credentials on the local IPC socket (SO_PEERCRED / getpeereid,
# LOCAL_PEERPID, proc_pidpath). Already in the dependency graph transitively, so
# this only promotes it to a direct dependency rather than adding a new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Named pipe security descriptor (SDDL), peer process id and peer executable
# lookup. Also already in the graph via tauri/tokio.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_Pipes",
	"Win32_System_Threading",
] }
