[package]
name = "Bittery"
version = "0.1.0"
description = "Bittery Zero-Knowledge Password Manager"
authors = ["you"]
edition = "2021"
default-run = "Bittery"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bittery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Native messaging host binary
[[bin]]
name = "bittery-native-host"
path = "src/native_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-biometry = "0.2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
base64 = "0.22"

# Native crypto
bittery-crypto-core = { path = "../../../packages/crypto/core/crates/bittery-crypto-core" }

# OS keychain access (macOS Keychain, Windows Credential Manager, Linux Secret Service)
# Platform-specific features must be enabled for actual keychain storage
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["linux-native"]

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
