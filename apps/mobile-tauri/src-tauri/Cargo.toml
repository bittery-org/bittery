[package]
name = "bittery-mobile"
version = "0.5.2"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "bittery_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-biometry = "0.2"
tauri-plugin-clipboard-manager = "2"
# First-party, in this repo. The path dependency plus the crate's `links` key is what
# makes the Tauri CLI emit the Gradle `include` for its `android/` module.
tauri-plugin-bittery-keystore = { path = "plugins/keystore" }
tauri-plugin-bittery-credential-provider = { path = "plugins/credential-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# An unstripped debug .so makes a 249 MB APK, which does not fit on a stock
# emulator image. Nothing measured here runs in the Rust host, so the DWARF
# buys nothing and costs an install.
[profile.dev]
strip = "debuginfo"
