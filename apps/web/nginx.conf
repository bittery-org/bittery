server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compatibility-first CSP for the static SPA:
    # - Keeps WASM and worker crypto working
    # - Allows the framework bootstrap inline script in index.html
    # - Allows Cloudflare Web Analytics when enabled at the edge
    set $csp_policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https: http: wss: ws: https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: blob: https://cloudflareinsights.com https://*.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; frame-src 'none';";
    set $csp_report_only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https: http: wss: ws: https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: blob: https://cloudflareinsights.com https://*.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; frame-src 'none';";

    # Re-include default MIME types (a bare `types {}` block would replace them)
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header Content-Security-Policy $csp_policy always;
    add_header Content-Security-Policy-Report-Only $csp_report_only always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Vite hashed assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-declare security headers because nginx does not inherit add_header
        # from parent blocks when add_header is used in a child location.
        add_header Content-Security-Policy $csp_policy always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
