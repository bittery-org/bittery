apply plugin: 'com.android.library'
apply plugin: 'kotlin-kapt'

group = 'expo.modules.credentialprovider'
version = '0.7.6'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.credentialprovider"
  defaultConfig {
    versionCode 1
    versionName "0.7.6"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    // Specify which ABIs to support for native crypto
    ndk {
      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Autolinking cleanses @bittery/crypto-react-native to this stable Gradle project name.
  implementation project(':bittery_crypto-react-native')

  // Credential Manager
  implementation "androidx.credentials:credentials:1.6.0-rc01"

  // Autofill inline suggestions
  implementation "androidx.autofill:autofill:1.1.0"

  // Biometric authentication
  implementation "androidx.biometric:biometric:1.2.0-alpha05"

  // Room database for credential storage
  implementation "androidx.room:room-runtime:2.7.0"
  implementation "androidx.room:room-ktx:2.7.0"
  kapt "androidx.room:room-compiler:2.7.0"

  // JVM unit tests (src/test) - no emulator, so they can run anywhere.
  // org.json is only a stub in the android.jar the unit-test classpath uses;
  // the real artifact is needed to parse the shared domain-matching vectors.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20250107"

  androidTestImplementation "androidx.room:room-testing:2.7.0"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"

  // Coroutines
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // AppCompat for FragmentActivity (required for BiometricPrompt)
  implementation "androidx.appcompat:appcompat:1.6.1"

  // Lifecycle
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
}
