name: bittery

services:
  postgres:
    image: postgres
    container_name: bittery-postgres
    environment:
      POSTGRES_DB: bittery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Bind to loopback: Docker's port publishing bypasses ufw/nftables rules,
      # so an unqualified mapping would expose this password-less dev DB publicly.
      - "127.0.0.1:5436:5432"
    volumes:
      - bittery_postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: bittery-valkey
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bittery_postgres_data: