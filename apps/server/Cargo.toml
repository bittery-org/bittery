[package]
name = "bittery-server"
version = "0.5.2"
edition = "2021"
default-run = "bittery-server"

[[bin]]
name = "bittery-server"
path = "src/main.rs"

[[bin]]
name = "write-openapi"
path = "src/bin/write-openapi.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["macros", "postgres", "runtime-tokio-rustls", "time"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
utoipa = { version = "=5.5.0", features = ["chrono"] }
utoipa-axum = "=0.2.0"
fred = { version = "10", features = ["subscriber-client", "i-hashes", "i-keys", "i-scripts", "i-pubsub", "sha-1"] }
dotenvy = "0.15"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
# `unbiased` restores rand 0.8's rejection-sampling guarantee for `random_range`.
# rand 0.9 made the default single-value sampler Canon's method, which is
# documented as biased; this is used to generate share-link tokens and
# verification codes, so the exact-uniform variant is the one we want.
rand = { version = "0.10", features = ["unbiased"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11"
hmac = "0.13"
url = "2"
jsonwebtoken = "11"
parking_lot = "0.12"
bittery-crypto-core = { path = "../../packages/crypto/core/crates/bittery-crypto-core" }

[dev-dependencies]
futures-util = "0.3"
