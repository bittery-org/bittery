[package]
name = "bittery-server"
version = "0.1.2"
edition = "2021"
default-run = "bittery-server"

[[bin]]
name = "bittery-server"
path = "src/main.rs"

[[bin]]
name = "write-bindings"
path = "src/bin/write-bindings.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.12"
jsonrpsee = { version = "0.25", features = ["server"] }
qubit = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
ts-rs = { version = "10.1.0", features = ["serde-json-impl"] }
fred = { version = "10", features = ["subscriber-client", "i-hashes", "i-keys", "i-scripts", "i-pubsub", "sha-1"] }
dotenvy = "0.15"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
jsonwebtoken = "9"
parking_lot = "0.12"
bittery-crypto-core = { path = "../../packages/crypto/core/crates/bittery-crypto-core" }

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
