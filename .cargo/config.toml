# Android 15+ devices may use 16 KB memory pages. These ELF linker settings are
# backward-compatible with the 4 KB pages used by older Android devices.
[target.'cfg(target_os = "android")']
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
