<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bittery — Unlock · Monolith</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     UNLOCK VARIANT 2 — MONOLITH
     One centered dialog card on the bare canvas, using the exact
     dialog recipe from the design system: popover surface,
     rounded-xl, shadow-pop, and the sanctioned brand-accent
     header (primary-deep wash + via-primary hairline).
     ============================================================ */
  :root {
    --bg:        oklch(0.126 0.008 282);
    --sidebar:   oklch(0.148 0.011 283);
    --card:      oklch(0.172 0.013 283);
    --popover:   oklch(0.196 0.015 284);
    --overlay:   oklch(0.225 0.017 284);

    --border:        oklch(1 0 0 / 0.065);
    --border-strong: oklch(1 0 0 / 0.11);

    --text-1: oklch(0.935 0.005 288);
    --text-2: oklch(0.715 0.010 288);
    --text-3: oklch(0.535 0.013 288);

    --hover:  oklch(1 0 0 / 0.045);

    --primary:       oklch(0.70 0.165 288);
    --primary-deep:  oklch(0.58 0.185 292);
    --primary-fg:    oklch(0.985 0.005 288);

    --green:  oklch(0.72 0.14 160);

    --radius:    10px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-xl: 14px;

    --shadow-pop: 0 0 0 1px oklch(1 0 0 / 0.07), 0 16px 44px oklch(0 0 0 / 0.55), 0 3px 10px oklch(0 0 0 / 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: -0.006em;
    font-feature-settings: "cv05", "cv11";
    background: var(--bg);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  svg { display: block; flex: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
  input { font: inherit; letter-spacing: inherit; }

  .stage {
    height: 100vh;
    display: flex; flex-direction: column;
    position: relative;
  }
  /* faint ambient glow behind the card — the only decoration on the canvas */
  .stage::before {
    content: "";
    position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
    width: 720px; height: 480px;
    background: radial-gradient(50% 50% at 50% 42%, oklch(0.58 0.185 292 / 0.1), transparent 70%);
    pointer-events: none;
  }
  .traffic { position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; z-index: 90; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; background: oklch(1 0 0 / 0.14); }
  .wordmark {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%);
    font-size: 19px; font-weight: 700; letter-spacing: -0.035em;
    color: var(--primary);
    filter: drop-shadow(0 0 16px oklch(0.58 0.185 292 / 0.35));
    user-select: none;
  }

  .stage-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }

  /* ================= CARD ================= */
  .card {
    position: relative;
    width: 100%; max-width: 384px;
    background: var(--popover);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  /* brand moment: dialog brand accent — top wash + hairline */
  .card::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 96px;
    background: linear-gradient(to bottom, oklch(0.58 0.185 292 / 0.2), transparent);
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(to right, transparent, oklch(0.72 0.17 288 / 0.55), transparent);
  }

  .card-body { position: relative; padding: 30px 28px 24px; display: flex; flex-direction: column; align-items: center; }

  .avatars { display: flex; margin-bottom: 16px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 650; color: var(--primary-fg); letter-spacing: 0.02em;
    box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.14), 0 0 0 3px var(--popover);
  }
  .avatar + .avatar { margin-left: -10px; }
  .avatar.a1 { background: linear-gradient(135deg, oklch(0.62 0.19 288), oklch(0.45 0.19 305)); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.16), 0 0 0 3px var(--popover), 0 0 18px oklch(0.58 0.185 292 / 0.4); }
  .avatar.a2 { background: linear-gradient(135deg, oklch(0.55 0.1 220), oklch(0.45 0.1 250)); }

  .headline { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
  .subline  { font-size: 12px; color: var(--text-3); margin-top: 3px; margin-bottom: 22px; display: flex; align-items: center; gap: 6px; }
  .subline .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }

  form { width: 100%; }

  .pw-group {
    display: flex; align-items: center; gap: 4px;
    height: 38px; padding: 0 5px 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: oklch(1 0 0 / 0.025);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .pw-group:hover { border-color: var(--border-strong); }
  .pw-group:focus-within {
    border-color: oklch(0.70 0.165 288 / 0.6);
    box-shadow: 0 0 0 3px oklch(0.70 0.165 288 / 0.16), 0 0 18px oklch(0.58 0.185 292 / 0.15);
  }
  .pw-group input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-1); font-size: 13px; }
  .pw-group input::placeholder { color: var(--text-3); }
  .pw-btn {
    display: grid; place-items: center;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    color: var(--text-3);
    transition: background 0.1s, color 0.1s;
  }
  .pw-btn:hover { background: var(--hover); color: var(--text-1); }

  /* brand moment: glowing gradient primary action */
  .btn-unlock {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; height: 36px; margin-top: 12px;
    border-radius: var(--radius-md);
    background: linear-gradient(to bottom, oklch(0.72 0.165 286), oklch(0.63 0.18 293));
    color: var(--primary-fg);
    font-size: 13px; font-weight: 550;
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.22), 0 1px 2px oklch(0 0 0 / 0.3), 0 0 16px oklch(0.58 0.185 292 / 0.35);
    transition: filter 0.12s ease, box-shadow 0.12s ease;
    position: relative;
  }
  .btn-unlock:hover { filter: brightness(1.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.22), 0 1px 2px oklch(0 0 0 / 0.3), 0 0 22px oklch(0.58 0.185 292 / 0.5); }
  .btn-unlock .label { display: flex; align-items: center; gap: 7px; transition: opacity 0.15s ease; }
  .btn-unlock .spinner {
    position: absolute; opacity: 0;
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid oklch(1 0 0 / 0.35); border-top-color: var(--primary-fg);
    animation: spin 0.7s linear infinite;
    transition: opacity 0.15s ease;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.unlocking .btn-unlock .label { opacity: 0; }
  body.unlocking .btn-unlock .spinner { opacity: 1; }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0;
    font-size: 10.5px; font-weight: 550; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3);
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .btn-bio {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 34px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: oklch(1 0 0 / 0.02);
    color: var(--text-2);
    font-size: 12.5px; font-weight: 500;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .btn-bio:hover { background: var(--hover); color: var(--text-1); border-color: var(--border-strong); }
  .btn-bio svg { color: var(--primary); filter: drop-shadow(0 0 5px oklch(0.70 0.165 288 / 0.45)); }

  .card-footer {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: oklch(1 0 0 / 0.015);
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 8px;
    border-radius: var(--radius-sm);
    font-size: 11px; color: var(--text-3);
    transition: background 0.1s, color 0.1s;
  }
  .chip:hover { background: var(--hover); color: var(--text-2); }

  body.unlocking .card { animation: card-exit 0.5s ease 0.9s forwards; }
  @keyframes card-exit { to { opacity: 0; transform: translateY(-10px) scale(0.97); } }

  .variant-chip {
    position: fixed; right: 14px; bottom: 12px; z-index: 100;
    font-size: 10.5px; font-weight: 550; letter-spacing: 0.04em;
    color: var(--text-3);
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    box-shadow: 0 2px 10px oklch(0 0 0 / 0.4);
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></symbol>
    <symbol id="i-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9.5" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5a15 15 0 0 1 4 9.5 15 15 0 0 1-4 9.5 15 15 0 0 1-4-9.5 15 15 0 0 1 4-9.5z"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="traffic"><i></i><i></i><i></i></div>
  <div class="wordmark">bittery</div>

  <div class="stage-main">
    <div class="card">
      <div class="card-body">
        <div class="avatars">
          <span class="avatar a1">QW</span>
          <span class="avatar a2">JS</span>
        </div>

        <h1 class="headline">Unlock Bittery</h1>
        <p class="subline">2 accounts <span class="dot"></span> locked 12 min ago</p>

        <form id="unlockForm">
          <div class="pw-group">
            <input id="pw" type="password" placeholder="Enter your master password" autofocus autocomplete="off" />
            <button type="button" class="pw-btn" id="toggle" title="Show password">
              <svg class="on" width="15" height="15"><use href="#i-eye"/></svg>
              <svg class="off" width="15" height="15" style="display:none"><use href="#i-eye-off"/></svg>
            </button>
          </div>

          <button class="btn-unlock" type="submit">
            <span class="label"><svg width="13" height="13"><use href="#i-lock"/></svg>Unlock</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <div class="divider">or</div>

          <button class="btn-bio" type="button" id="bio">
            <svg width="15" height="15"><use href="#i-finger"/></svg>
            Unlock with Touch ID
          </button>
        </form>
      </div>

      <div class="card-footer">
        <button class="chip" type="button">
          <svg width="11" height="11"><use href="#i-server"/></svg>
          vault.qrawall.com
          <svg width="9" height="9"><use href="#i-chev-d"/></svg>
        </button>
        <button class="chip" type="button">
          <svg width="11" height="11"><use href="#i-globe"/></svg>
          English
          <svg width="9" height="9"><use href="#i-chev-d"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="variant-chip">Unlock · 2 — Monolith</div>

<script>
  const pw = document.getElementById('pw');
  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    toggle.querySelector('.on').style.display = hidden ? 'none' : 'block';
    toggle.querySelector('.off').style.display = hidden ? 'block' : 'none';
    pw.focus();
  });

  function previewUnlock() {
    if (document.body.classList.contains('unlocking')) return;
    document.body.classList.add('unlocking');
    setTimeout(() => document.body.classList.remove('unlocking'), 2200);
  }
  document.getElementById('unlockForm').addEventListener('submit', (e) => { e.preventDefault(); previewUnlock(); });
  document.getElementById('bio').addEventListener('click', previewUnlock);
</script>
</body>
</html>
