<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bittery — Unlock · Vault Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     UNLOCK VARIANT 6 — VAULT DIAL  (new concept)
     A bank-vault rotary dial as the centerpiece: a ring of
     hairline tick marks with a single glowing purple index mark,
     and the lock at its center. Typing "turns the dial" (ticks
     rotate subtly per keystroke); unlocking spins it free.
     Everything else stays quiet and chrome-free.
     ============================================================ */
  :root {
    --bg:        oklch(0.126 0.008 282);
    --sidebar:   oklch(0.148 0.011 283);
    --card:      oklch(0.172 0.013 283);
    --popover:   oklch(0.196 0.015 284);
    --overlay:   oklch(0.225 0.017 284);

    --border:        oklch(1 0 0 / 0.065);
    --border-strong: oklch(1 0 0 / 0.11);

    --text-1: oklch(0.935 0.005 288);
    --text-2: oklch(0.715 0.010 288);
    --text-3: oklch(0.535 0.013 288);

    --hover:  oklch(1 0 0 / 0.04);

    --primary:       oklch(0.70 0.165 288);
    --primary-deep:  oklch(0.58 0.185 292);
    --primary-fg:    oklch(0.985 0.005 288);

    --green:  oklch(0.72 0.14 160);

    --radius:    10px;
    --radius-sm: 6px;

    --shadow-pop: 0 0 0 1px oklch(1 0 0 / 0.07), 0 10px 28px oklch(0 0 0 / 0.5), 0 2px 8px oklch(0 0 0 / 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: -0.006em;
    font-feature-settings: "cv05", "cv11";
    background: var(--bg);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  svg { display: block; flex: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
  input { font: inherit; letter-spacing: inherit; }

  .stage {
    height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  /* one quiet glow pooled behind the dial */
  .stage::before {
    content: "";
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
    width: 640px; height: 520px;
    background: radial-gradient(50% 50% at 50% 45%, oklch(0.58 0.185 292 / 0.12), transparent 70%);
    pointer-events: none;
  }
  .traffic { position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; z-index: 90; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; background: oklch(1 0 0 / 0.14); }
  .wordmark {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%);
    font-size: 18px; font-weight: 700; letter-spacing: -0.035em;
    color: var(--primary);
    filter: drop-shadow(0 0 16px oklch(0.58 0.185 292 / 0.35));
    user-select: none;
  }

  .center {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; max-width: 420px; padding: 0 24px;
    position: relative;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  /* ================= THE DIAL ================= */
  .dial { position: relative; width: 196px; height: 196px; margin-bottom: 26px; }
  .dial .ticks {
    position: absolute; inset: 0;
    transition: transform 0.18s cubic-bezier(0.2, 0.6, 0.3, 1);
    will-change: transform;
  }
  .dial .ticks line { stroke: oklch(1 0 0 / 0.13); stroke-width: 1.5; stroke-linecap: round; }
  .dial .ticks line.major { stroke: oklch(1 0 0 / 0.24); }
  /* the fixed index mark at 12 o'clock */
  .dial .index {
    position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    width: 2px; height: 14px; border-radius: 2px;
    background: var(--primary);
    box-shadow: 0 0 10px oklch(0.70 0.165 288 / 0.85);
    animation: index-breathe 4.5s ease-in-out infinite;
  }
  @keyframes index-breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

  .dial .hub {
    position: absolute; inset: 34px;
    border-radius: 50%;
    background: var(--popover);
    border: 1px solid var(--border-strong);
    display: grid; place-items: center;
    box-shadow: 0 10px 30px oklch(0 0 0 / 0.5), inset 0 1px 0 oklch(1 0 0 / 0.06), 0 0 26px oklch(0.58 0.185 292 / 0.18);
    transition: box-shadow 0.5s ease;
  }
  .dial .hub svg { color: var(--primary); filter: drop-shadow(0 0 7px oklch(0.70 0.165 288 / 0.55)); position: absolute; transition: opacity 0.25s ease, transform 0.25s ease; }
  .dial .hub .ic-unlock { opacity: 0; transform: scale(0.8); }
  /* tiny account avatars resting at the bottom edge of the hub */
  .dial .hub-accounts {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex;
  }
  .mini-avatar {
    width: 20px; height: 20px; border-radius: 6px;
    display: grid; place-items: center;
    font-size: 8.5px; font-weight: 650; color: var(--primary-fg); letter-spacing: 0.02em;
    box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.16), 0 0 0 2.5px var(--popover);
  }
  .mini-avatar + .mini-avatar { margin-left: -6px; }
  .mini-avatar.a1 { background: linear-gradient(135deg, oklch(0.62 0.19 288), oklch(0.45 0.19 305)); }
  .mini-avatar.a2 { background: linear-gradient(135deg, oklch(0.55 0.1 220), oklch(0.45 0.1 250)); }

  .headline { font-size: 18px; font-weight: 600; letter-spacing: -0.018em; }
  .subline  { font-size: 12.5px; color: var(--text-3); margin-top: 4px; margin-bottom: 26px; }

  /* ---- password bar ---- */
  form { width: 100%; }
  .pw-palette {
    display: flex; align-items: center; gap: 9px;
    width: 100%; height: 44px; padding: 0 7px 0 14px;
    border-radius: var(--radius);
    background: var(--popover);
    box-shadow: var(--shadow-pop);
    transition: box-shadow 0.15s ease;
  }
  .pw-palette:focus-within {
    box-shadow:
      0 0 0 1px oklch(0.70 0.165 288 / 0.55),
      0 0 0 4px oklch(0.70 0.165 288 / 0.14),
      0 10px 28px oklch(0 0 0 / 0.5),
      0 0 26px oklch(0.58 0.185 292 / 0.2);
  }
  .pw-palette > .key-ic { color: var(--text-3); }
  .pw-palette input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-1); font-size: 13.5px; }
  .pw-palette input::placeholder { color: var(--text-3); }
  .kbd {
    font-size: 10px; font-weight: 500; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 5px; line-height: 1.3;
    background: oklch(1 0 0 / 0.03);
  }
  .pw-btn {
    display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    color: var(--text-3);
    transition: background 0.1s, color 0.1s;
  }
  .pw-btn:hover { background: var(--hover); color: var(--text-1); }
  .pw-btn.bio { color: var(--primary); }
  .pw-btn.bio:hover { color: var(--primary); filter: brightness(1.12); }

  /* ================= FOOTER ================= */
  .stage-footer {
    display: flex; align-items: center; gap: 4px;
    padding-bottom: 16px;
    transition: opacity 0.45s ease;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 9px;
    border-radius: var(--radius-sm);
    font-size: 11px; color: var(--text-3);
    transition: background 0.1s, color 0.1s;
  }
  .chip:hover { background: var(--hover); color: var(--text-2); }
  .foot-sep { width: 3px; height: 3px; border-radius: 50%; background: oklch(1 0 0 / 0.14); }

  /* ================= UNLOCK PREVIEW ================= */
  body.unlocking .dial .ticks { transition: transform 1.1s cubic-bezier(0.3, 0, 0.15, 1); }
  body.unlocking .dial .hub {
    box-shadow: 0 10px 30px oklch(0 0 0 / 0.5), inset 0 1px 0 oklch(1 0 0 / 0.06), 0 0 52px oklch(0.58 0.185 292 / 0.55);
  }
  body.unlocking .dial .hub .ic-lock { opacity: 0; transform: scale(0.8); }
  body.unlocking .dial .hub .ic-unlock { opacity: 1; transform: scale(1); }
  body.unlocking .dial .index { background: var(--green); box-shadow: 0 0 10px oklch(0.72 0.14 160 / 0.85); animation: none; }
  body.unlocking .center { animation: stage-exit 0.5s ease 1s forwards; }
  body.unlocking .stage-footer { opacity: 0; }
  @keyframes stage-exit { to { opacity: 0; transform: translateY(-10px) scale(0.985); } }

  .variant-chip {
    position: fixed; right: 14px; bottom: 12px; z-index: 100;
    font-size: 10.5px; font-weight: 550; letter-spacing: 0.04em;
    color: var(--text-3);
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    box-shadow: 0 2px 10px oklch(0 0 0 / 0.4);
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9.5" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9.5" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 7.9-.8"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></symbol>
    <symbol id="i-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5a15 15 0 0 1 4 9.5 15 15 0 0 1-4 9.5 15 15 0 0 1-4-9.5 15 15 0 0 1 4-9.5z"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="traffic"><i></i><i></i><i></i></div>
  <div class="wordmark">bittery</div>

  <div class="center">
    <div class="dial" aria-hidden="true">
      <svg class="ticks" id="ticks" viewBox="0 0 196 196"></svg>
      <span class="index"></span>
      <div class="hub">
        <svg class="ic-lock" width="24" height="24"><use href="#i-lock"/></svg>
        <svg class="ic-unlock" width="24" height="24"><use href="#i-unlock"/></svg>
        <div class="hub-accounts">
          <span class="mini-avatar a1">QW</span>
          <span class="mini-avatar a2">JS</span>
        </div>
      </div>
    </div>

    <h1 class="headline">Bittery is locked</h1>
    <p class="subline">Enter your master password to unlock 2 accounts.</p>

    <form id="unlockForm">
      <div class="pw-palette">
        <svg class="key-ic" width="15" height="15"><use href="#i-key"/></svg>
        <input id="pw" type="password" placeholder="Master password…" autofocus autocomplete="off" />
        <button type="button" class="pw-btn" id="toggle" title="Show password">
          <svg class="on" width="15" height="15"><use href="#i-eye"/></svg>
          <svg class="off" width="15" height="15" style="display:none"><use href="#i-eye-off"/></svg>
        </button>
        <button type="button" class="pw-btn bio" id="bio" title="Unlock with Touch ID">
          <svg width="16" height="16"><use href="#i-finger"/></svg>
        </button>
        <span class="kbd">⏎</span>
      </div>
    </form>
  </div>

  <footer class="stage-footer">
    <button class="chip" type="button"><svg width="11" height="11"><use href="#i-server"/></svg>vault.qrawall.com</button>
    <span class="foot-sep"></span>
    <button class="chip" type="button">Help</button>
    <span class="foot-sep"></span>
    <button class="chip" type="button"><svg width="11" height="11"><use href="#i-globe"/></svg>English</button>
  </footer>
</div>

<div class="variant-chip">Unlock · 6 — Vault Dial</div>

<script>
  // Build the tick ring: 60 ticks, every 5th is a major tick.
  const ticksSvg = document.getElementById('ticks');
  const C = 98, R_OUT = 96;
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const a = (i / 60) * Math.PI * 2;
    const rIn = major ? 84 : 89;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', C + Math.sin(a) * rIn);
    line.setAttribute('y1', C - Math.cos(a) * rIn);
    line.setAttribute('x2', C + Math.sin(a) * R_OUT);
    line.setAttribute('y2', C - Math.cos(a) * R_OUT);
    if (major) line.setAttribute('class', 'major');
    ticksSvg.appendChild(line);
  }

  // Typing turns the dial: each keystroke nudges the tick ring.
  const pw = document.getElementById('pw');
  let angle = 0;
  pw.addEventListener('input', (e) => {
    if (document.body.classList.contains('unlocking')) return;
    angle += (e.inputType && e.inputType.startsWith('delete')) ? -6 : 6;
    ticksSvg.style.transform = `rotate(${angle}deg)`;
  });

  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    toggle.querySelector('.on').style.display = hidden ? 'none' : 'block';
    toggle.querySelector('.off').style.display = hidden ? 'block' : 'none';
    pw.focus();
  });

  function previewUnlock() {
    if (document.body.classList.contains('unlocking')) return;
    document.body.classList.add('unlocking');
    angle += 160;
    ticksSvg.style.transform = `rotate(${angle}deg)`;
    setTimeout(() => {
      document.body.classList.remove('unlocking');
      angle = 0;
      ticksSvg.style.transform = 'rotate(0deg)';
    }, 2400);
  }
  document.getElementById('unlockForm').addEventListener('submit', (e) => { e.preventDefault(); previewUnlock(); });
  document.getElementById('bio').addEventListener('click', previewUnlock);
</script>
</body>
</html>
