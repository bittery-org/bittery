id: CREDENTIAL-PROVIDER-016
durability_profile: native-crash-durable
requirements:
  - PRIVACY-017
  - AUTH-045
  - AUTH-046
  - ARCH-ENGINE-007
  - ARCH-ENGINE-008
  - ARCH-ENGINE-009
  - ARCH-ENGINE-010
  - ARCH-ENGINE-011
  - ARCH-ENGINE-013
  - ARCH-STORE-020
  - ARCH-STORE-027
  - AUTH-048
  - ITEM-007
  - SYNC-001
given:
  replica:
    server: server-A
    account: account-A
    commit_sequence: 80
    provider_lease: shared
    local_overlay: []
  main_host:
    session: unlocked
    live_account_keys: present
  provider_host:
    session: locked
    live_account_keys: absent
    suggestion_index:
      visible_fields: [item-title, username, website-match, local-account-label]
      forbidden_fields: [password, totp-seed, passkey-private-material, vault-name, server-address]
  server:
    reachable: false
  operation_log: []
  device_identity:
    grant: one shared Mobile Device Grant
    main_credential_record: wrapped for main host
    provider_credential_record: wrapped for Provider host
    next_unreserved_request_counter: 400
  connectivity: offline
when:
  - command_or_event: the OS asks for credentials matching example.com
  - command_or_event: the Provider emits only the permitted locked suggestion
  - command_or_event: the User selects the suggestion and authorizes Provider password or
      system-gated quick unlock
  - command_or_event: the Provider opens account-A in its own core without changing the main session
  - command_or_event: the main host and Provider each prepare a guarded Item mutation from snapshot 80
  - command_or_event: both submit; one receives StaleSnapshot, recomputes, and commits after the other
  - command_or_event: the Provider durably accepts new Login operation-P before any network request
  - inject_failure: terminate the Provider after local acknowledgement and before Sync
  - command_or_event: the main host reopens the operation queue after connectivity returns
  - command_or_event: the main host reserves a request-counter range disjoint from the Provider's
      previously committed range
  - command_or_event: the main host synchronizes operation-P
then:
  visible_projection:
    before_provider_unlock:
      exactly: [item-title, username, website-match, local-account-label]
    os_credential_response: contains only the User-selected credential result
    main_host_session: remains independently unlocked throughout
    provider_host_after_termination: locked with no live Account or wrapping keys
  durable_replica:
    commit_sequence: 83
    serial_order: both concurrent mutations followed by operation-P
    operation-P: committed without partial overlay or duplicate
    second_replica_or_provider_mirror: absent
    request_counters: Provider and main ranges are disjoint; termination may leave only a gap
  operation_state:
    operation-P: committed after main-host continuation
  server_state:
    operation-P: committed exactly once
  emitted_events:
    - no Account, Vault, wrapping, or signing key crosses a platform binding
    - one Device Grant and revocation state cover both hosts
    - Provider termination releases its shared Replica Lease
    - an exclusive maintenance request while either shared lease is held returns retryable busy
    - Provider unlock does not unlock or renew the main host
